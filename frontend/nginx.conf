server {
  listen 80;
  client_max_body_size 10m;

  # Compresión: la red del SENA y los datos móviles lo agradecen
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Encabezados de seguridad para la aplicación web
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # Los enlaces de justificación llevan un token en la URL: que no se filtre a otros sitios
  add_header Referrer-Policy "same-origin" always;

  # React Router: cualquier ruta sirve index.html
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo
  location /assets/ {
    root /usr/share/nginx/html;
    expires 30d;
    # (un add_header aquí reemplaza los del server: se repite nosniff)
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Proxy de la API y Socket.IO hacia el backend. X-Forwarded-For lleva la IP
  # real del cliente (la usa el límite de peticiones del backend).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
